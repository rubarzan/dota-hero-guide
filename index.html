<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Hero Guide</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Dota 2 Hero Guide</h1>
        <p>Choose a hero to view the guide</p>
    </header>

    <main>
        <div class="hero-grid">

            <div class="hero-card">
                <img
    class="hero-image"
    src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/necrophos.png"
    alt="Necrophos"
>
                <h2>Necrophos</h2>
                <button>View Guide</button>
            </div>

            <div class="hero-card">
                <div class="hero-image axe"></div>
                <h2>Axe</h2>
                <button>View Guide</button>
            </div>

            <div class="hero-card">
                <div class="hero-image faceless-void"></div>
                <h2>Faceless Void</h2>
                <button>View Guide</button>
            </div>

        </div>
    </main>

</body>
</html>
